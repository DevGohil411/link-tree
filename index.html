<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Dev | Connect &amp; Watch</title>
  <meta name="description" content="Personal creator hub for Dev. Instant direct access to featured Instagram Reels and YouTube Shorts.">
  <meta name="theme-color" content="#070709">

  <!-- Open Graph / Social Sharing -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Dev | Connect &amp; Watch">
  <meta property="og:description" content="Personal creator hub for Dev. Instant direct access to featured Instagram Reels and YouTube Shorts.">
  <meta property="og:site_name" content="Dev">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Dev | Connect &amp; Watch">
  <meta name="twitter:description" content="Personal creator hub for Dev. Instant direct access to featured Instagram Reels and YouTube Shorts.">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg-base: #070709;
      --card-bg: rgba(18, 19, 24, 0.65);
      --card-border: rgba(255, 255, 255, 0.07);
      --card-border-hover: rgba(255, 255, 255, 0.16);
      
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-subtle: #4b5563;

      --ig-accent: #e1306c;
      --ig-glow: rgba(225, 48, 108, 0.14);
      --yt-accent: #ff0033;
      --yt-glow: rgba(255, 0, 51, 0.14);

      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    html {
      background-color: var(--bg-base);
      color-scheme: dark;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
      padding: calc(env(safe-area-inset-top, 0px) + 28px) 18px calc(env(safe-area-inset-bottom, 0px) + 24px);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Subtle CSS Noise Grain Texture */
    .bg-grain {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      opacity: 0.028;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Ambient Glow Spots */
    .glow-profile {
      position: fixed;
      top: 15%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.12) 0%, rgba(139, 92, 246, 0.04) 50%, transparent 70%);
      filter: blur(60px);
      pointer-events: none;
      z-index: 0;
    }

    .glow-cards {
      position: fixed;
      top: 55%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 380px;
      height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.07) 0%, rgba(236, 72, 153, 0.04) 50%, transparent 75%);
      filter: blur(70px);
      pointer-events: none;
      z-index: 0;
    }

    /* Main Hub Container */
    .hub-container {
      width: 100%;
      max-width: 470px;
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Header Styling */
    .hub-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: fadeIn 0.4s var(--ease-out) both;
    }

    /* Sophisticated Emblem Avatar */
    .avatar-container {
      position: relative;
      width: 82px;
      height: 82px;
      margin-bottom: 16px;
    }

    .avatar-halo {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.35), rgba(236, 72, 153, 0.15), rgba(59, 130, 246, 0.3));
      filter: blur(8px);
      opacity: 0.7;
    }

    .avatar-frame {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: linear-gradient(145deg, #151720 0%, #0c0d12 100%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 12px 28px -6px rgba(0, 0, 0, 0.75), inset 0 1px 1px rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .avatar-emblem {
      width: 36px;
      height: 36px;
      color: #f1f5f9;
      opacity: 0.95;
    }

    /* Name & Subtitle */
    .profile-name {
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: var(--text-main);
      margin-bottom: 5px;
    }

    .profile-subtitle {
      font-size: 0.8125rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .micro-tag {
      display: inline-block;
      font-size: 0.625rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #64748b;
      padding: 3px 9px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 6px;
    }

    /* Hero Context Line */
    .hub-hero {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 24px 0 20px 0;
      animation: fadeIn 0.4s var(--ease-out) 0.08s both;
    }

    .hero-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.07), transparent);
    }

    .hero-text {
      font-size: 0.78rem;
      font-weight: 500;
      color: #64748b;
      letter-spacing: 0.02em;
    }

    /* Social Cards Stack */
    .links-stack {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .media-card {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 72px;
      padding: 14px 18px;
      text-decoration: none;
      color: inherit;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.5);
      transition: transform 0.24s var(--ease-out),
                  border-color 0.24s var(--ease-out),
                  background-color 0.24s var(--ease-out),
                  box-shadow 0.24s var(--ease-out);
      cursor: pointer;
      outline: none;
    }

    .media-card:focus-visible {
      border-color: rgba(255, 255, 255, 0.35);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.12);
    }

    /* Card Entrance Stagger */
    .media-card-ig {
      animation: fadeInUp 0.4s var(--ease-out) 0.16s both;
    }

    .media-card-yt {
      animation: fadeInUp 0.4s var(--ease-out) 0.24s both;
    }

    /* Icon Box */
    .icon-box {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 15px;
      flex-shrink: 0;
      transition: background-color 0.24s var(--ease-out), border-color 0.24s var(--ease-out), transform 0.24s var(--ease-out);
    }

    .icon-box svg {
      width: 22px;
      height: 22px;
      fill: #ffffff;
      opacity: 0.9;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    /* Card Content */
    .card-meta {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: center;
      min-width: 0;
    }

    .card-title {
      font-size: 1.02rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.01em;
      line-height: 1.25;
    }

    .card-subtitle {
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Trailing Arrow */
    .arrow-box {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: 10px;
      flex-shrink: 0;
      color: #64748b;
      transition: color 0.22s var(--ease-out);
    }

    .arrow-box svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.22s var(--ease-out);
    }

    /* Instagram Hover State */
    .media-card-ig:hover {
      background-color: rgba(26, 22, 27, 0.75);
      border-color: rgba(225, 48, 108, 0.3);
      box-shadow: 0 16px 36px -10px rgba(0, 0, 0, 0.6), 0 0 25px var(--ig-glow);
      transform: translateY(-2px);
    }

    .media-card-ig:hover .icon-box {
      background: rgba(225, 48, 108, 0.12);
      border-color: rgba(225, 48, 108, 0.25);
    }

    .media-card-ig:hover .arrow-box {
      color: #ffffff;
    }

    .media-card-ig:hover .arrow-box svg {
      transform: translateX(4px);
    }

    /* YouTube Hover State */
    .media-card-yt:hover {
      background-color: rgba(27, 20, 22, 0.75);
      border-color: rgba(255, 0, 51, 0.3);
      box-shadow: 0 16px 36px -10px rgba(0, 0, 0, 0.6), 0 0 25px var(--yt-glow);
      transform: translateY(-2px);
    }

    .media-card-yt:hover .icon-box {
      background: rgba(255, 0, 51, 0.12);
      border-color: rgba(255, 0, 51, 0.25);
    }

    .media-card-yt:hover .arrow-box {
      color: #ffffff;
    }

    .media-card-yt:hover .arrow-box svg {
      transform: translateX(4px);
    }

    /* Mobile Tap State */
    .media-card:active {
      transform: scale(0.98) !important;
    }

    /* Compact Balanced Footer */
    .hub-footer {
      text-align: center;
      margin-top: 32px;
      animation: fadeIn 0.4s var(--ease-out) 0.32s both;
    }

    .footer-copy {
      font-size: 0.78rem;
      font-weight: 500;
      color: #64748b;
      letter-spacing: -0.01em;
    }

    .footer-note {
      font-size: 0.72rem;
      color: #475569;
      margin-top: 2px;
    }

    /* Keyframes */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-delay: 0ms !important;
        transition-duration: 0.01ms !important;
      }
      .media-card-ig:hover, .media-card-yt:hover {
        transform: none;
      }
      .arrow-box svg {
        transform: none !important;
      }
    }
  </style>
</head>
<body>
  <!-- Layered Background -->
  <div class="bg-grain" aria-hidden="true"></div>
  <div class="glow-profile" aria-hidden="true"></div>
  <div class="glow-cards" aria-hidden="true"></div>

  <!-- Main Hub -->
  <main class="hub-container">
    
    <!-- Profile Header -->
    <header class="hub-header">
      <div class="avatar-container">
        <div class="avatar-halo" aria-hidden="true"></div>
        <div class="avatar-frame">
          <!-- Elegant Monogram Emblem -->
          <svg class="avatar-emblem" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M11 9H20C25.5228 9 30 13.4772 30 19C30 24.5228 25.5228 29 20 29H11V9Z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
            <path d="M11 16H20C21.6569 16 23 17.3431 23 19C23 20.6569 21.6569 22 20 22H11" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
          </svg>
        </div>
      </div>

      <h1 class="profile-name">Dev</h1>
      <p class="profile-subtitle">Connect &bull; Watch &bull; Follow</p>
      <span class="micro-tag">Personal Hub</span>
    </header>

    <!-- Context Divider / Hero -->
    <div class="hub-hero">
      <div class="hero-line" aria-hidden="true"></div>
      <span class="hero-text">Explore my latest content</span>
      <div class="hero-line" aria-hidden="true"></div>
    </div>

    <!-- Social Cards Navigation -->
    <nav class="links-stack" aria-label="Social links">
      
      <!-- Instagram Card -->
      <a 
        href="https://www.instagram.com/reel/DbXLURQyYeU/?stkn=cm1scmxhMXZlbThi" 
        target="_blank" 
        rel="noopener noreferrer" 
        class="media-card media-card-ig"
      >
        <div class="icon-box" aria-hidden="true">
          <!-- Inline Instagram Icon -->
          <svg viewBox="0 0 24 24">
            <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
          </svg>
        </div>
        <div class="card-meta">
          <span class="card-title">Instagram</span>
          <span class="card-subtitle">Watch my latest Reel</span>
        </div>
        <div class="arrow-box" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </div>
      </a>

      <!-- YouTube Card -->
      <a 
        href="https://youtube.com/shorts/tToLcHW1ZJo?si=6pUk8mceNavgaMMC" 
        target="_blank" 
        rel="noopener noreferrer" 
        class="media-card media-card-yt"
      >
        <div class="icon-box" aria-hidden="true">
          <!-- Inline YouTube Icon -->
          <svg viewBox="0 0 24 24">
            <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
          </svg>
        </div>
        <div class="card-meta">
          <span class="card-title">YouTube</span>
          <span class="card-subtitle">Watch my latest Short</span>
        </div>
        <div class="arrow-box" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </div>
      </a>

    </nav>

    <!-- Footer -->
    <footer class="hub-footer">
      <p class="footer-copy">&copy; 2026 Dev</p>
      <p class="footer-note">Thanks for stopping by.</p>
    </footer>

  </main>
</body>
</html>
