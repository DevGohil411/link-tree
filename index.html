<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Connect &amp; Watch | Official Hub</title>
  <meta name="description" content="Stay connected. Stay inspired. Explore my latest content, updates and videos — all in one place.">
  <meta name="theme-color" content="#f8fafc">

  <!-- Open Graph / Social Sharing -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Connect &amp; Watch | Official Hub">
  <meta property="og:description" content="Stay connected. Stay inspired. Explore my latest content, updates and videos — all in one place.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Connect &amp; Watch | Official Hub">
  <meta name="twitter:description" content="Stay connected. Stay inspired. Explore my latest content, updates and videos — all in one place.">

  <!-- Premium Typography: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      /* Brand Color Tokens */
      --bg-base: #f8fafc;
      --bg-subtle: #f1f5f9;
      
      --navy-950: #070d18;
      --navy-900: #0b1528;
      --navy-800: #101e38;
      --slate-600: #475569;
      --slate-500: #64748b;
      --slate-400: #94a3b8;
      --slate-300: #cbd5e1;
      --slate-200: #e2e8f0;

      /* Electric & Cyber Accents */
      --blue-electric: #2563eb;
      --blue-vibrant: #1d4ed8;
      --cyan-core: #0284c7;
      --cyan-bright: #06b6d4;

      /* Surface Tokens */
      --surface-card: rgba(255, 255, 255, 0.88);
      --border-card: rgba(226, 232, 240, 0.9);
      --border-card-hover: rgba(59, 130, 246, 0.42);
      
      --shadow-card: 
        0 2px 4px rgba(15, 23, 42, 0.02),
        0 10px 24px -4px rgba(15, 23, 42, 0.04),
        inset 0 1px 0 rgba(255, 255, 255, 0.95);
      --shadow-card-hover: 
        0 6px 14px -2px rgba(15, 23, 42, 0.03),
        0 18px 32px -4px rgba(37, 99, 235, 0.11),
        inset 0 1px 0 rgba(255, 255, 255, 1);

      /* Micro Dynamics */
      --ease-apple: cubic-bezier(0.16, 1, 0.3, 1);
    }

    html {
      background-color: var(--bg-base);
      color-scheme: light;
      font-size: 16px;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-base);
      color: var(--navy-900);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
      padding: calc(env(safe-area-inset-top, 0px) + 24px) 20px calc(env(safe-area-inset-bottom, 0px) + 24px);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ==========================================================================
       BACKGROUND ARCHITECTURE
       ========================================================================== */
    .bg-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    /* Multi-stop Soft Base Gradient */
    .bg-gradient-field {
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(ellipse 70% 50% at 50% -5%, rgba(224, 242, 254, 0.85) 0%, rgba(248, 250, 252, 0) 70%),
        radial-gradient(ellipse 55% 45% at 88% 85%, rgba(219, 234, 254, 0.5) 0%, rgba(248, 250, 252, 0) 70%),
        linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
    }

    /* Precision Technical Grid */
    .bg-grid-mesh {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(148, 163, 184, 0.07) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(148, 163, 184, 0.07) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: radial-gradient(circle at 50% 42%, rgba(0, 0, 0, 1) 25%, rgba(0, 0, 0, 0) 80%);
      -webkit-mask-image: radial-gradient(circle at 50% 42%, rgba(0, 0, 0, 1) 25%, rgba(0, 0, 0, 0) 80%);
      opacity: 0.85;
    }

    /* Soft Atmospheric Light Glows */
    .ambient-glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      opacity: 0.65;
    }

    .ambient-glow-top {
      top: -10%;
      left: 50%;
      transform: translateX(-50%);
      width: 480px;
      height: 320px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.25) 0%, rgba(37, 99, 235, 0.14) 50%, transparent 80%);
    }

    /* ==========================================================================
       CENTRAL LINK-IN-BIO CARD CONTAINER
       ========================================================================== */
    .bio-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 490px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: containerReveal 0.65s var(--ease-apple) both;
    }

    @keyframes containerReveal {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.99);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* ==========================================================================
       HERO / IDENTITY SECTION
       ========================================================================== */
    .bio-header {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 24px;
    }

    /* Brand Logo Vessel: Abstract Link / Connection Mark */
    .brand-mark-pedestal {
      position: relative;
      width: 72px;
      height: 72px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Subtle Radial Atmospheric Glow beneath Logo */
    .brand-glow-halo {
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.35) 0%, rgba(37, 99, 235, 0.18) 55%, transparent 75%);
      filter: blur(12px);
      z-index: 0;
    }

    /* 3D Glass & Chrome Shield Housing the Abstract Connection Glyph */
    .brand-mark-emblem {
      position: relative;
      width: 66px;
      height: 66px;
      border-radius: 20px;
      z-index: 1;
      background: 
        radial-gradient(circle at 35% 25%, rgba(255, 255, 255, 0.98) 0%, rgba(240, 249, 255, 0.75) 40%, rgba(224, 242, 254, 0.45) 75%, rgba(203, 213, 225, 0.8) 100%);
      box-shadow: 
        0 10px 24px -4px rgba(15, 23, 42, 0.08),
        0 4px 10px -2px rgba(37, 99, 235, 0.16),
        inset 0 1.5px 2px rgba(255, 255, 255, 1),
        inset 0 -2px 5px rgba(15, 23, 42, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .brand-mark-emblem svg {
      width: 36px;
      height: 36px;
      display: block;
    }

    /* Eyebrow Label */
    .eyebrow-pill {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--slate-600);
      margin-bottom: 12px;
      user-select: none;
    }

    .eyebrow-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--blue-electric);
      box-shadow: 0 0 6px rgba(37, 99, 235, 0.7);
    }

    /* Editorial Headline */
    .bio-title {
      font-size: clamp(2rem, 5.2vw, 2.5rem);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.035em;
      color: var(--navy-950);
      margin-bottom: 10px;
    }

    .bio-title-gradient {
      display: block;
      background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 45%, #0284c7 80%, #06b6d4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Subtitle Description */
    .bio-desc {
      font-size: 15px;
      font-weight: 450;
      line-height: 1.5;
      color: var(--slate-500);
      max-width: 360px;
      margin: 0 auto;
    }

    /* ==========================================================================
       LINK CARDS NAVIGATION
       ========================================================================== */
    .links-stack {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 13px;
      margin-bottom: 24px;
    }

    /* Premium Link Card Item */
    .bio-link-card {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 22px;
      background: var(--surface-card);
      border: 1px solid var(--border-card);
      border-radius: 20px;
      box-shadow: var(--shadow-card);
      text-decoration: none;
      color: inherit;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: 
        transform 0.28s var(--ease-apple),
        box-shadow 0.28s var(--ease-apple),
        border-color 0.28s var(--ease-apple);
      overflow: hidden;
    }

    /* Specular Reflection Highlight */
    .bio-link-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 12%;
      right: 12%;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.95) 50%, transparent 100%);
      pointer-events: none;
    }

    /* Hover Micro-Interactions */
    .bio-link-card:hover {
      transform: translateY(-2.5px);
      border-color: var(--border-card-hover);
      box-shadow: var(--shadow-card-hover);
    }

    .bio-link-card:active {
      transform: scale(0.985);
      transition-duration: 0.12s;
    }

    /* Left Group */
    .card-left {
      display: flex;
      align-items: center;
      gap: 16px;
      text-align: left;
    }

    /* Clean Brand Icon Frame */
    .card-icon-container {
      position: relative;
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: #ffffff;
      border: 1px solid rgba(226, 232, 240, 0.95);
      box-shadow: 0 4px 10px rgba(15, 23, 42, 0.04);
      transition: transform 0.28s var(--ease-apple), box-shadow 0.28s var(--ease-apple);
    }

    .bio-link-card:hover .card-icon-container {
      transform: scale(1.05);
      box-shadow: 0 6px 14px rgba(15, 23, 42, 0.08);
    }

    .card-icon-container svg {
      width: 24px;
      height: 24px;
      display: block;
    }

    /* Real Brand Gradients/Colors (Isolated to SVGs) */
    .svg-ig-gradient {
      fill: url(#instagramBrandGrad);
    }

    .svg-yt-red {
      fill: #ff0000;
    }

    /* Card Text Stack */
    .card-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .card-heading {
      font-size: 16px;
      font-weight: 700;
      color: var(--navy-950);
      letter-spacing: -0.015em;
      line-height: 1.25;
    }

    .card-caption {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--slate-500);
      line-height: 1.35;
    }

    /* Right Action Arrow Button */
    .card-arrow-circle {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: rgba(241, 245, 249, 0.7);
      border: 1px solid rgba(226, 232, 240, 0.85);
      color: var(--slate-500);
      transition: 
        transform 0.28s var(--ease-apple),
        background-color 0.28s var(--ease-apple),
        color 0.28s var(--ease-apple),
        border-color 0.28s var(--ease-apple);
    }

    .card-arrow-circle svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.28s var(--ease-apple);
    }

    .bio-link-card:hover .card-arrow-circle {
      transform: translateX(3.5px);
      background: rgba(37, 99, 235, 0.08);
      border-color: rgba(37, 99, 235, 0.25);
      color: var(--blue-electric);
    }

    /* ==========================================================================
       MORE COMING SOON DIVIDER
       ========================================================================== */
    .coming-soon-bar {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 2px 0 20px;
    }

    .bar-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(203, 213, 225, 0.75), transparent);
    }

    .bar-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--slate-400);
      user-select: none;
    }

    .bar-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background-color: var(--blue-electric);
      opacity: 0.8;
    }

    /* ==========================================================================
       CLEAN EXECUTIVE FOOTER
       ========================================================================== */
    .bio-footer {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .footer-text {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--slate-400);
      letter-spacing: -0.01em;
    }

    /* ==========================================================================
       RESPONSIVE ERGONOMICS
       ========================================================================== */
    @media (max-width: 480px) {
      body {
        padding: calc(env(safe-area-inset-top, 0px) + 20px) 16px calc(env(safe-area-inset-bottom, 0px) + 18px);
      }

      .bio-header {
        margin-bottom: 20px;
      }

      .brand-mark-pedestal {
        width: 66px;
        height: 66px;
        margin-bottom: 16px;
      }

      .brand-mark-emblem {
        width: 60px;
        height: 60px;
        border-radius: 18px;
      }

      .brand-mark-emblem svg {
        width: 32px;
        height: 32px;
      }

      .bio-title {
        font-size: 1.95rem;
      }

      .bio-desc {
        font-size: 14.5px;
      }

      .bio-link-card {
        padding: 16px 18px;
        border-radius: 18px;
      }

      .card-icon-container {
        width: 44px;
        height: 44px;
      }

      .card-icon-container svg {
        width: 22px;
        height: 22px;
      }

      .card-heading {
        font-size: 15.5px;
      }

      .card-caption {
        font-size: 13px;
      }
    }

    /* Touch screen device adaptations */
    @media (hover: none) and (pointer: coarse) {
      .bio-link-card:hover {
        transform: none;
      }
      .bio-link-card:hover .card-arrow-circle {
        transform: none;
      }
      .bio-link-card:hover .card-icon-container {
        transform: none;
      }
      .bio-link-card:active {
        transform: scale(0.985);
      }
    }

    /* Accessibility: Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- Background Environment -->
  <div class="bg-canvas" aria-hidden="true">
    <div class="bg-gradient-field"></div>
    <div class="bg-grid-mesh"></div>

  <!-- Isolated Gradients Definition -->
  <svg style="position: absolute; width: 0; height: 0; overflow: hidden;" aria-hidden="true">
    <defs>
      <!-- Real Instagram Brand Gradient -->
      <linearGradient id="instagramBrandGrad" x1="0%" y1="100%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#f09433"/>

        <stop offset="0%" stop-color="#38bdf8"/>
        <stop offset="50%" stop-color="#2563eb"/>
        <stop offset="100%" stop-color="#0b1528"/>
      </linearGradient>
    </defs>
  </svg>

  <!-- Central Link-in-Bio Card -->
  <main class="bio-container">

    <!-- Header & Identity Section -->

      <!-- Abstract Connection & Digital Movement Brand Mark -->
      <div class="brand-mark-pedestal" aria-hidden="true">
        <div class="brand-glow-halo"></div>
        <div class="brand-mark-emblem">
          <!-- Sleek Geometric Infinity/Connection Symbol -->

            <path

            <!-- Interlocking Right Connection Loop -->

      <!-- Eyebrow Label -->

        <span class="eyebrow-dot" aria-hidden="true"></span>

      <!-- Main Headline -->
      <h1 class="bio-title">
        Stay Connected.
        <span class="bio-title-gradient">Stay Inspired.</span>
      </h1>

      <!-- Controlled Subtitle -->
      <p class="bio-desc">
        Explore my latest content, updates and videos — all in one place.
      </p>
    </header>

    <!-- Social Links Stack -->
    <nav class="links-stack" aria-label="Featured Social Media">

      <!-- Instagram Link Card -->
      <a 
        href="https://www.instagram.com/reel/DbXLURQyYeU/?stkn=cm1scmxhMXZlbThi" 
        target="_blank" 
        rel="noopener noreferrer" 
        class="bio-link-card"

        <div class="card-left">

            <!-- Inline Instagram Icon with Pure Brand Gradient -->

              <path class="svg-ig-gradient" d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>

        </div>
        <div class="card-arrow-circle" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </div>
      </a>

      <!-- YouTube Link Card -->
      <a 
        href="https://youtube.com/shorts/tToLcHW1ZJo?si=6pUk8mceNavgaMMC" 
        target="_blank" 
        rel="noopener noreferrer" 
        class="bio-link-card"
        id="link-youtube"
      >
        <div class="card-left">
          <div class="card-icon-container" aria-hidden="true">
