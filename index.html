<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Connect &amp; Watch | Official Links</title>
  <meta name="description" content="Stay connected. Stay inspired. Explore my latest content, updates and videos — all in one place.">
  <meta name="theme-color" content="#fff5f7">

  <!-- Open Graph / Social Sharing -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Connect &amp; Watch | Official Links">
  <meta property="og:description" content="Stay connected. Stay inspired. Explore my latest content, updates and videos — all in one place.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Connect &amp; Watch | Official Links">
  <meta name="twitter:description" content="Stay connected. Stay inspired. Explore my latest content, updates and videos — all in one place.">

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg-base: #fcf9fb;
      --card-bg: rgba(255, 255, 255, 0.72);
      --card-border: rgba(255, 255, 255, 0.85);
      --card-border-subtle: rgba(230, 215, 230, 0.45);
      
      --text-main: #1e1b29;
      --text-muted: #5e5972;
      --text-subtle: #968fa3;

      --ig-gradient: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      --ig-shadow: 0 16px 36px -10px rgba(220, 39, 67, 0.22);
      
      --yt-gradient: linear-gradient(135deg, #ff334b 0%, #e60026 100%);
      --yt-shadow: 0 16px 36px -10px rgba(255, 0, 51, 0.22);

      --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
    }

    html {
      background-color: var(--bg-base);
      color-scheme: light;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
      padding: calc(env(safe-area-inset-top, 0px) + 26px) 20px calc(env(safe-area-inset-bottom, 0px) + 24px);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Vibrant Ambient Gradient Environment */
    .ambient-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
      background: radial-gradient(at 0% 0%, #fff0f5 0%, #faf3fa 50%, #f7f3ff 100%);
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(75px);
      opacity: 0.68;
      pointer-events: none;
      animation: floatMotion 18s ease-in-out infinite alternate;
    }

    .blob-1 {
      top: -10%;
      left: -12%;
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, #fca5a5 0%, #f472b6 40%, #c084fc 80%);
      animation-duration: 16s;
    }

    .blob-2 {
      top: 25%;
      right: -15%;
      width: 360px;
      height: 360px;
      background: radial-gradient(circle, #fed7aa 0%, #fb923c 40%, #f43f5e 80%);
      animation-duration: 20s;
      animation-delay: -4s;
    }

    .blob-3 {
      bottom: -15%;
      left: 10%;
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, #93c5fd 0%, #c084fc 40%, #f472b6 80%);
      animation-duration: 22s;
      animation-delay: -8s;
    }

    .blob-4 {
      top: 45%;
      left: -10%;
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, #fde047 0%, #f97316 60%, transparent 80%);
      opacity: 0.35;
      animation-duration: 14s;
      animation-delay: -2s;
    }

    @keyframes floatMotion {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(25px, 20px) scale(1.08); }
      100% { transform: translate(-20px, 30px) scale(0.95); }
    }

    /* Subtle Floating Sparkles */
    .sparkle {
      position: absolute;
      color: rgba(192, 132, 252, 0.45);
      font-size: 13px;
      pointer-events: none;
      user-select: none;
      animation: pulseSparkle 4s ease-in-out infinite alternate;
    }

    .sparkle-1 { top: 12%; left: 16%; animation-delay: 0.5s; }
    .sparkle-2 { top: 22%; right: 14%; animation-delay: 1.5s; color: rgba(244, 114, 182, 0.5); font-size: 15px; }
    .sparkle-3 { bottom: 20%; left: 12%; animation-delay: 2.2s; color: rgba(251, 146, 60, 0.45); }
    .sparkle-4 { bottom: 28%; right: 15%; animation-delay: 3s; font-size: 12px; }

    @keyframes pulseSparkle {
      0% { opacity: 0.2; transform: scale(0.8) rotate(0deg); }
      100% { opacity: 0.85; transform: scale(1.15) rotate(15deg); }
    }

    /* Main Card Container */
    .hub-wrapper {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Hero / Header Section */
    .hero-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
      margin-bottom: 26px;
      animation: entranceFade 0.5s var(--ease-spring) both;
    }

    /* Abstract Iridescent Orb Avatar */
    .orb-stage {
      position: relative;
      width: 90px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }

    .orb-glow {
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f472b6, #fb923c, #93c5fd, #c084fc);
      filter: blur(14px);
      opacity: 0.65;
      animation: orbPulse 6s ease-in-out infinite alternate;
    }

    .orb-sphere {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 35%, #8ec5fc 70%, #e0c3fc 100%);
      background-size: 200% 200%;
      animation: gradientShift 8s ease infinite alternate;
      border: 3px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 14px 28px -6px rgba(244, 63, 94, 0.28),
                  inset 0 2px 4px rgba(255, 255, 255, 0.8),
                  inset 0 -6px 12px rgba(120, 53, 140, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .orb-inner-gloss {
      position: absolute;
      top: 5px;
      left: 12px;
      width: 36px;
      height: 22px;
      border-radius: 50%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.75) 0%, rgba(255, 255, 255, 0) 100%);
      transform: rotate(-25deg);
    }

    .orb-center-sparkle {
      color: #ffffff;
      font-size: 24px;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.2));
      animation: gentleSpin 16s linear infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes orbPulse {
      0% { transform: scale(0.96); opacity: 0.55; }
      100% { transform: scale(1.08); opacity: 0.8; }
    }

    @keyframes gentleSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Small Elegant Label */
    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.6875rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #9d3972;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(244, 114, 182, 0.35);
      border-radius: 999px;
      padding: 5px 14px;
      margin-bottom: 12px;
      box-shadow: 0 4px 12px rgba(220, 39, 67, 0.08);
    }

    /* Friendly Bold Headline */
    .hero-title {
      font-size: 1.625rem;
      font-weight: 800;
      line-height: 1.22;
      letter-spacing: -0.03em;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .hero-title span {
      background: linear-gradient(135deg, #e11d48 0%, #9333ea 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Soft Subtitle Description */
    .hero-desc {
      font-size: 0.9rem;
      font-weight: 500;
      line-height: 1.45;
      color: var(--text-muted);
      max-width: 340px;
    }

    /* Main Links Stack */
    .cards-stack {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 18px;
    }

    /* Glassmorphism Social Cards */
    .glass-card {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 76px;
      padding: 15px 18px;
      text-decoration: none;
      color: inherit;
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      box-shadow: 0 10px 28px -6px rgba(135, 115, 150, 0.12),
                  0 2px 6px rgba(255, 255, 255, 0.9);
      transition: transform 0.28s var(--ease-spring),
                  box-shadow 0.28s var(--ease-spring),
                  border-color 0.28s var(--ease-spring),
                  background 0.28s var(--ease-spring);
      cursor: pointer;
      user-select: none;
      outline: none;
    }

    .glass-card:focus-visible {
      border-color: #ec4899;
      box-shadow: 0 0 0 4px rgba(236, 72, 153, 0.2);
    }

    /* Card Stagger Entrance */
    .card-ig {
      animation: entranceFadeUp 0.5s var(--ease-spring) 0.1s both;
    }

    .card-yt {
      animation: entranceFadeUp 0.5s var(--ease-spring) 0.2s both;
    }

    /* Card Icon Area */
    .card-icon-wrapper {
      width: 48px;
      height: 48px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 15px;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
      box-shadow: 0 6px 16px -3px rgba(0, 0, 0, 0.15),
                  inset 0 1px 1px rgba(255, 255, 255, 0.4);
      transition: transform 0.28s var(--ease-spring);
    }

    .card-icon-wrapper svg {
      width: 24px;
      height: 24px;
      fill: #ffffff;
      position: relative;
      z-index: 1;
    }

    /* Instagram Card Details */
    .card-ig .card-icon-wrapper {
      background: var(--ig-gradient);
    }

    .card-ig:hover {
      background: rgba(255, 255, 255, 0.88);
      border-color: rgba(244, 114, 182, 0.6);
      transform: translateY(-3px) scale(1.01);
      box-shadow: 0 16px 36px -8px rgba(220, 39, 67, 0.22),
                  0 4px 12px rgba(255, 255, 255, 0.9);
    }

    .card-ig:hover .card-icon-wrapper {
      transform: scale(1.05) rotate(2deg);
    }

    /* YouTube Card Details */
    .card-yt .card-icon-wrapper {
      background: var(--yt-gradient);
    }

    .card-yt:hover {
      background: rgba(255, 255, 255, 0.88);
      border-color: rgba(255, 100, 120, 0.6);
      transform: translateY(-3px) scale(1.01);
      box-shadow: 0 16px 36px -8px rgba(255, 0, 51, 0.2),
                  0 4px 12px rgba(255, 255, 255, 0.9);
    }

    .card-yt:hover .card-icon-wrapper {
      transform: scale(1.05) rotate(-2deg);
    }

    /* Content Area */
    .card-text-group {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: center;
      min-width: 0;
    }

    .card-heading {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.015em;
      line-height: 1.25;
    }

    .card-subheading {
      font-size: 0.825rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* Trailing Action Arrow */
    .card-arrow {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(240, 235, 245, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: 10px;
      flex-shrink: 0;
      color: var(--text-muted);
      transition: transform 0.25s var(--ease-spring),
                  background-color 0.25s ease,
                  color 0.25s ease;
    }

    .card-arrow svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.25s var(--ease-spring);
    }

    .glass-card:hover .card-arrow {
      color: #e11d48;
      background: rgba(254, 226, 226, 0.7);
      transform: translateX(3px);
    }

    .glass-card:active {
      transform: scale(0.98) !important;
    }

    /* Teaser Note */
    .teaser-line {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #a855f7;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 22px;
      opacity: 0.85;
      animation: entranceFade 0.5s var(--ease-spring) 0.3s both;
    }

    /* Minimal Elegant Footer */
    .hub-footer {
      text-align: center;
      animation: entranceFade 0.5s var(--ease-spring) 0.35s both;
    }

    .footer-heart-note {
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.01em;
    }

    /* Entrance Keyframes */
    @keyframes entranceFade {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes entranceFadeUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Touch screen ergonomics */
    @media (hover: none) and (pointer: coarse) {
      .glass-card:hover {
        transform: none;
      }
      .glass-card:active {
        transform: scale(0.98);
      }
    }

    /* Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- Ambient Vibrant Blurred Gradient Environment -->
  <div class="ambient-canvas" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>

    <!-- Delicate Aesthetic Sparkles -->
    <span class="sparkle sparkle-1">✦</span>

  <!-- Main Content Hub -->
  <main class="hub-wrapper">

      <div class="orb-stage" aria-hidden="true">

      <p class="hero-desc">

    </header>

    <nav class="cards-stack" aria-label="Featured Social Links">

          </svg>
        </div>
        <div class="card-text-group">
          <span class="card-heading">Instagram</span>
          <span class="card-subheading">Watch my latest Reel</span>
        </div>
        <div class="card-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </div>
      </a>

      <!-- YouTube Card -->
      <a 
        href="https://youtube.com/shorts/tToLcHW1ZJo?si=6pUk8mceNavgaMMC" 
        target="_blank" 
        rel="noopener noreferrer" 
        class="glass-card card-yt"

          <!-- Inline YouTube Icon -->
          <svg viewBox="0 0 24 24">

        <div class="card-text-group">
          <span class="card-heading">YouTube</span>

        <div class="card-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </div>
      </a>

    </nav>

    <!-- Subtle Teaser Line -->
    <div class="teaser-line">
      <span>More coming soon</span>
      <span>✦</span>
    </div>

    <!-- Minimal Elegant Footer -->
    <footer class="hub-footer">
      <p class="footer-heart-note">Thanks for stopping by ♡</p>
    </footer>

  </main>
</body>
</html>
