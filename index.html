<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mahi | Connect &amp; Watch</title>
  <meta name="description" content="Official personal hub for Mahi. Instant access to featured Instagram Reels and YouTube Shorts.">
  <meta name="theme-color" content="#0a0a0c">
  
  <!-- Open Graph / Social Sharing -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Mahi | Connect &amp; Watch">
  <meta property="og:description" content="Instant access to featured Instagram Reels and YouTube Shorts.">
  <meta property="og:site_name" content="Mahi">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Mahi | Connect &amp; Watch">
  <meta name="twitter:description" content="Instant access to featured Instagram Reels and YouTube Shorts.">

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* CSS Reset & Design Tokens */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg-primary: #090a0f;
      --bg-surface: rgba(255, 255, 255, 0.035);
      --bg-surface-hover: rgba(255, 255, 255, 0.065);
      --bg-surface-active: rgba(255, 255, 255, 0.09);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-highlight: rgba(255, 255, 255, 0.18);
      
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-tertiary: #64748b;

      --ig-gradient: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      --yt-red: #ff0033;
      --yt-gradient: linear-gradient(135deg, #ff2a54 0%, #e60029 100%);
      
      --shadow-ambient: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
      --shadow-glow-ig: 0 12px 30px -10px rgba(220, 39, 67, 0.28);
      --shadow-glow-yt: 0 12px 30px -10px rgba(255, 0, 51, 0.28);
      
      --radius-avatar: 50%;
      --radius-card: 20px;
      --radius-icon: 14px;
    }

    html {
      background-color: var(--bg-primary);
      color-scheme: dark;
      font-size: 16px;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: hidden;
      position: relative;
      padding: calc(env(safe-area-inset-top, 0px) + 36px) 20px calc(env(safe-area-inset-bottom, 0px) + 28px);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Ambient Dynamic Backdrop */
    .ambient-glow {
      position: fixed;
      pointer-events: none;
      z-index: 0;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.55;
    }

    .glow-top {
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 360px;
      height: 360px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.18) 0%, rgba(217, 70, 239, 0.08) 50%, transparent 75%);
    }

    .glow-bottom {
      bottom: -150px;
      left: 50%;
      transform: translateX(-50%);
      width: 420px;
      height: 380px;
      background: radial-gradient(circle, rgba(239, 68, 68, 0.12) 0%, rgba(168, 85, 247, 0.06) 50%, transparent 80%);
    }

    /* Container constraints */
    .page-container {
      width: 100%;
      max-width: 430px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 1;
      margin: auto 0;
    }

    /* Header Section */
    .profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 34px;
    }

    .avatar-wrapper {
      position: relative;
      margin-bottom: 18px;
    }

    .avatar-ring {
      position: absolute;
      inset: -3px;
      border-radius: var(--radius-avatar);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.15));
      filter: blur(0.5px);
    }

    .avatar {
      position: relative;
      width: 92px;
      height: 92px;
      border-radius: var(--radius-avatar);
      background: linear-gradient(145deg, #1e2230 0%, #11131a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.15);
      border: 1px solid var(--border-subtle);
      overflow: hidden;
    }

    .avatar-initial {
      font-size: 2.15rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      background: linear-gradient(180deg, #ffffff 30%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      user-select: none;
    }

    .name-badge-row {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .profile-name {
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    /* Polished Visual Accredit Badge (Non-deceptive styling) */
    .creator-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 19px;
      height: 19px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8 0%, #6366f1 100%);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(56, 189, 248, 0.35);
      flex-shrink: 0;
    }

    .creator-badge svg {
      width: 11px;
      height: 11px;
      fill: currentColor;
    }

    .profile-subtitle {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-secondary);
      letter-spacing: 0.03em;
      text-transform: uppercase;
      opacity: 0.9;
    }

    /* Main Links Section */
    .links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .link-card {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
      padding: 16px 20px;
      min-height: 82px;
      text-decoration: none;
      color: inherit;
      background: var(--bg-surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-ambient);
      transition: transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1),
                  border-color 0.22s ease,
                  background-color 0.22s ease,
                  box-shadow 0.22s ease;
      cursor: pointer;
      user-select: none;
      outline: none;
    }

    .link-card:focus-visible {
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.15);
    }

    /* Icon Container */
    .card-icon-container {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-icon);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 16px;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2);
    }

    .card-icon-container svg {
      width: 25px;
      height: 25px;
      fill: #ffffff;
      position: relative;
      z-index: 1;
    }

    /* Instagram Card Styling */
    .card-instagram .card-icon-container {
      background: var(--ig-gradient);
    }

    .card-instagram:hover {
      background-color: var(--bg-surface-hover);
      border-color: rgba(220, 39, 67, 0.35);
      box-shadow: var(--shadow-ambient), var(--shadow-glow-ig);
      transform: translateY(-2px);
    }

    .card-instagram:active {
      transform: scale(0.985);
      background-color: var(--bg-surface-active);
      box-shadow: 0 10px 20px -8px rgba(0, 0, 0, 0.6);
    }

    /* YouTube Card Styling */
    .card-youtube .card-icon-container {
      background: var(--yt-gradient);
    }

    .card-youtube:hover {
      background-color: var(--bg-surface-hover);
      border-color: rgba(255, 0, 51, 0.35);
      box-shadow: var(--shadow-ambient), var(--shadow-glow-yt);
      transform: translateY(-2px);
    }

    .card-youtube:active {
      transform: scale(0.985);
      background-color: var(--bg-surface-active);
      box-shadow: 0 10px 20px -8px rgba(0, 0, 0, 0.6);
    }

    /* Text Block */
    .card-content {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: center;
      min-width: 0;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.01em;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-subtitle {
      font-size: 0.825rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-top: 3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pill-tag {
      font-size: 0.685rem;
      font-weight: 600;
      padding: 1px 7px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-secondary);
      border: 1px solid rgba(255, 255, 255, 0.06);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* Trailing Action Icon */
    .card-action-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: 12px;
      flex-shrink: 0;
      color: var(--text-tertiary);
      transition: transform 0.22s ease, color 0.22s ease, background 0.22s ease;
    }

    .card-action-icon svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.2s ease;
    }

    .link-card:hover .card-action-icon {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
      transform: translateX(2px);
    }

    /* Footer Section */
    .page-footer {
      width: 100%;
      max-width: 430px;
      text-align: center;
      margin-top: 36px;
      position: relative;
      z-index: 1;
    }

    .footer-copyright {
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: -0.01em;
      margin-bottom: 4px;
    }

    .footer-note {
      font-size: 0.775rem;
      color: var(--text-tertiary);
      font-weight: 400;
    }

    /* Media queries for touch ergonomics */
    @media (hover: none) and (pointer: coarse) {
      .link-card:hover {
        transform: none;
      }
      .link-card:active {
        transform: scale(0.98);
      }
    }
  </style>
</head>
<body>
  <!-- Ambient Atmospheric Backdrops -->
  <div class="ambient-glow glow-top" aria-hidden="true"></div>
  <div class="ambient-glow glow-bottom" aria-hidden="true"></div>

  <!-- Main Content Container -->
  <main class="page-container">
    
    <!-- Profile Header -->
    <header class="profile-header">
      <div class="avatar-wrapper">
        <div class="avatar-ring" aria-hidden="true"></div>
        <div class="avatar">
          <span class="avatar-initial">M</span>
        </div>
      </div>
      
      <div class="name-badge-row">
        <h1 class="profile-name">Mahi</h1>
        <span class="creator-badge" title="Creator Profile" aria-label="Creator Profile">
          <!-- Subtle star check badge -->
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
          </svg>
        </span>
      </div>

      <p class="profile-subtitle">Connect &bull; Watch &bull; Follow</p>
    </header>

    <!-- Main Links Section -->
    <nav class="links-list" aria-label="Direct Social Links">
      
      <!-- Instagram Link Card -->
      <a 
        href="https://www.instagram.com/reel/DbXLURQyYeU/?stkn=cm1scmxhMXZlbThi" 
        target="_blank" 
        rel="noopener noreferrer" 
        class="link-card card-instagram"
        id="btn-instagram"
      >
        <div class="card-icon-container" aria-hidden="true">
          <!-- Instagram SVG Icon -->
          <svg viewBox="0 0 24 24">
            <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
          </svg>
        </div>
        <div class="card-content">
          <span class="card-title">Watch on Instagram</span>
          <span class="card-subtitle">
            Instagram Reel
            <span class="pill-tag">Video</span>
          </span>
        </div>
        <div class="card-action-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </div>
      </a>

      <!-- YouTube Link Card -->
      <a 
        href="https://youtube.com/shorts/tToLcHW1ZJo?si=6pUk8mceNavgaMMC" 
        target="_blank" 
        rel="noopener noreferrer" 
        class="link-card card-youtube"
        id="btn-youtube"
      >
        <div class="card-icon-container" aria-hidden="true">
          <!-- YouTube SVG Icon -->
          <svg viewBox="0 0 24 24">
            <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
          </svg>
        </div>
        <div class="card-content">
          <span class="card-title">Watch on YouTube</span>
          <span class="card-subtitle">
            YouTube Short
            <span class="pill-tag">Short</span>
          </span>
        </div>
        <div class="card-action-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </div>
      </a>

    </nav>
  </main>

  <!-- Page Footer -->
  <footer class="page-footer">
    <p class="footer-copyright">&copy; 2026 Mahi</p>
    <p class="footer-note">Thanks for stopping by.</p>
  </footer>

  <script>
    // Smooth micro-feedback on tap for mobile web views
    document.querySelectorAll('.link-card').forEach(card => {
      card.addEventListener('touchstart', function() {
        this.style.transform = 'scale(0.985)';
      }, { passive: true });

      card.addEventListener('touchend', function() {
        setTimeout(() => {
          this.style.transform = '';
        }, 150);
      }, { passive: true });
    });
  </script>
</body>
</html>
